<!DOCTYPE html><html lang="en-US" dir="ltr"><head>
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>9r3i\hblog</title>
</head><body>
<script>
;(async function(){
  const replacement=function(content){
    return content;
  },
  host='https://raw.githubusercontent.com/9r3i/mia/master/public/',
  route=async function(){
    let path=window.location.hash.substr(1).split('?')[0];
    path=path==''?'home.html':path;
    document.body.innerHTML='Loading...';
    let content=await fetch(host+'files/html/'+path)
      .then(r=>r.text())
      .catch(e=>'Failed to fetch: '+path);
    document.body.innerHTML=replacement(content);
    let title=document.querySelector('title');
    if(title){title.innerText=path.replace(/\.html$/,'');}
    return true;
  };
  window.addEventListener('popstate',e=>{
    return route();
  },false);
  return route();
})();
</script>
</body></html>
